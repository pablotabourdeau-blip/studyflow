let language=localStorage.getItem(LANG)||'en';
const translations={
 en:{'WORKSPACE':'WORKSPACE','Overview':'Overview','Assignments':'Assignments','Subjects':'Subjects','Calendar':'Calendar','Your academic life,':'Your academic life,','under control.':'under control.','Saved on this device':'Saved on this device','Good to see you 👋':'Good to see you 👋','Here’s what’s happening with your studies.':'Here’s what’s happening with your studies.','Keep track of everything you need to get done.':'Keep track of everything you need to get done.','See how you’re progressing in each subject.':'See how you’re progressing in each subject.','Your exams and deadlines, all in one place.':'Your exams and deadlines, all in one place.','＋ Add task':'＋ Add task','＋ Add event':'＋ Add event','Pending tasks':'Pending tasks','Completed':'Completed','Upcoming':'Upcoming','Exams':'Exams','Tasks left to complete':'Tasks left to complete','You’ve got this':'You’ve got this','With a future due date':'With a future due date','Upcoming assignments':'Upcoming assignments','View all →':'View all →','Subject progress':'Subject progress','No upcoming tasks yet.':'No upcoming tasks yet.','Add your first assignment to get started.':'Add your first assignment to get started.','Add your first subject.':'Add your first subject.','All assignments':'All assignments','All subjects':'All subjects','All tasks':'All tasks','Pending':'Pending','Completed':'Completed','Your subjects':'Your subjects',' subjects':' subjects','＋ Add subject':'＋ Add subject',' of ':' of ',' tasks completed · ':' tasks completed · ','Calendar':'Calendar','Homework':'Homework','Exam':'Exam','Delivery':'Delivery','No due date':'No due date','No tasks match these filters.':'No tasks match these filters.','Add subject first':'Add a subject first','Add assignment':'Add assignment','Edit assignment':'Edit assignment','TASK NAME':'TASK NAME','SUBJECT':'SUBJECT','DUE DATE':'DUE DATE','TYPE':'TYPE','Cancel':'Cancel','Save task':'Save task','Subject name:':'Subject name:','Task added':'Task added','Task updated':'Task updated','Task deleted':'Task deleted','Subject added':'Subject added','Subject deleted':'Subject deleted','This subject has tasks. Delete the subject and its tasks?':'This subject has tasks. Delete the subject and its tasks?'},
 es:{'WORKSPACE':'ESPACIO DE TRABAJO','Overview':'Resumen','Assignments':'Tareas','Subjects':'Asignaturas','Calendar':'Calendario','Your academic life,':'Tu vida académica,','under control.':'bajo control.','Saved on this device':'Guardado en este dispositivo','Good to see you 👋':'¡Qué bueno verte! 👋','Here’s what’s happening with your studies.':'Esto es lo que tienes pendiente.','Keep track of everything you need to get done.':'Organiza todo lo que tienes que hacer.','See how you’re progressing in each subject.':'Consulta tu progreso en cada asignatura.','Your exams and deadlines, all in one place.':'Tus exámenes y entregas, en un solo lugar.','＋ Add task':'＋ Añadir tarea','＋ Add event':'＋ Añadir evento','Pending tasks':'Tareas pendientes','Completed':'Completadas','Upcoming':'Próximas','Exams':'Exámenes','Tasks left to complete':'Tareas por completar','You’ve got this':'¡Tú puedes!','With a future due date':'Con fecha futura','Upcoming assignments':'Próximas tareas','View all →':'Ver todas →','Subject progress':'Progreso por asignatura','No upcoming tasks yet.':'No hay tareas próximas.','Add your first assignment to get started.':'Añade tu primera tarea para empezar.','Add your first subject.':'Añade tu primera asignatura.','All assignments':'Todas las tareas','All subjects':'Todas las asignaturas','All tasks':'Todas las tareas','Pending':'Pendientes','Your subjects':'Tus asignaturas','＋ Add subject':'＋ Añadir asignatura',' tasks completed · ':' tareas completadas · ','Homework':'Deberes','Exam':'Examen','Delivery':'Entrega','No due date':'Sin fecha de entrega','No tasks match these filters.':'Ninguna tarea coincide con estos filtros.','Add a subject first':'Añade primero una asignatura','Add assignment':'Añadir tarea','Edit assignment':'Editar tarea','TASK NAME':'NOMBRE DE LA TAREA','SUBJECT':'ASIGNATURA','DUE DATE':'FECHA DE ENTREGA','TYPE':'TIPO','Cancel':'Cancelar','Save task':'Guardar tarea','Subject name:':'Nombre de la asignatura:','Task added':'Tarea añadida','Task updated':'Tarea actualizada','Task deleted':'Tarea eliminada','Subject added':'Asignatura añadida','Subject deleted':'Asignatura eliminada','This subject has tasks. Delete the subject and its tasks?':'Esta asignatura tiene tareas. ¿Eliminar la asignatura y sus tareas?','e.g. Exercises 12–15, page 84':'p. ej. Ejercicios 12–15, página 84','Homework':'Deberes','Exam':'Examen','Delivery':'Entrega'},

gnatura:','Task added':'Tasca afegida','Task updated':'Tasca actualitzada','Task deleted':'Tasca eliminada','Subject added':'Assignatura afegida','Subject deleted':'Assignatura eliminada','This subject has tasks. Delete the subject and its tasks?':'Aquesta assignatura té tasques. Vols eliminar-la també amb les tasques?','e.g. Exercises 12–15, page 84':'p. ex. Exercicis 12–15, pàgina 84'}
};
function tr(value){return translations[language]?.[value]||value}
function translateMarkup(html){let out=html;const dict=translations[language]||{};for(const [a,b] of Object.entries(dict)){if(a && a!==b)out=out.split(a).join(b)}return out;}
const palette=['#7667e8','#e29b54','#4da98b','#d66c88','#5598c9','#9b75bd','#8e9b50'];
const today=new Date();today.setHours(0,0,0,0);const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{subjects:["Treball de Recerca 26-27","Tutoria Batx1","English 26-27 Batx1B","Filosofia 1r Batx B","Llengua i literatura castellana","Llengües +","Català 1r Batx B","Mates 1r Batx 26-27","Física 1r Batx","Tecnologia i Enginyeria","Química 1BTX 2027","Educació Física 1r BTX B"].map((name,i)=>({id:crypto.randomUUID(),name,color:palette[i%palette.length]})),tasks:[]};
const courseNames=["Treball de Recerca 26-27","Tutoria Batx1","English 26-27 Batx1B","Filosofia 1r Batx B","Llengua i literatura castellana","Llengües +","Català 1r Batx B","Mates 1r Batx 26-27","Física 1r Batx","Tecnologia i Enginyeria","Química 1BTX 2027","Educació Física 1r BTX B"];
const legacyMap={"Mathematics":"Mates 1r Batx 26-27","Physics & Chemistry":"Física 1r Batx","English":"English 26-27 Batx1B","Catalan":"Català 1r Batx B","Spanish":"Llengua i literatura castellana"};
const legacyNames=new Set(["Mathematics","Physics & Chemistry","History","English","Catalan","Spanish","Biology"]);
for(const oldSub of [...(data.subjects||[])]){if(!legacyNames.has(oldSub.name))continue;const targetName=legacyMap[oldSub.name],used=data.tasks.some(t=>t.subjectId===oldSub.id);if(targetName){const target=data.subjects.find(s=>s.name===targetName&&s.id!==oldSub.id);if(target){data.tasks.forEach(t=>{if(t.subjectId===oldSub.id)t.subjectId=target.id});data.subjects=data.subjects.filter(s=>s.id!==oldSub.id)}else if(used){oldSub.name=targetName}else{data.subjects=data.subjects.filter(s=>s.id!==oldSub.id)}}else if(!used){data.subjects=data.subjects.filter(s=>s.id!==oldSub.id)}}
for(const name of courseNames){if(!data.subjects.some(s=>s.name===name))data.subjects.push({id:crypto.randomUUID(),name,color:palette[data.subjects.length%palette.length]})}
const orderedSubjects=courseNames.map(name=>data.subjects.find(s=>s.name===name)).filter(Boolean);const extraSubjects=data.subjects.filter(s=>!courseNames.includes(s.name));data.subjects=[...orderedSubjects,...extraSubjects];
const examSeedKey="studyflow-exams-2026-nov-v1";
if(!localStorage.getItem(examSeedKey)){
 const examSpecs=[
  ["2026-11-12","Llengua i literatura castellana","Examen de Castellano · 11:30–13:30"],
  ["2026-11-13","Física 1r Batx","Examen de Física · 8:15–10:15"],
  ["2026-11-13","Filosofia 1r Batx B","Examen de Filosofía · 11:30–13:30"],
  ["2026-11-16","English 26-27 Batx1B","Examen de Inglés · 8:15–10:15"],
  ["2026-11-16","Català 1r Batx B","Examen de Catalán · 11:30–13:30"],
  ["2026-11-17","Tecnologia i Enginyeria","Examen de Tecnología · 11:30–13:30"],
  ["2026-11-18","Química 1BTX 2027","Examen de Química · 9:15–11:15"],
  ["2026-11-18","Mates 1r Batx 26-27","Examen de Matemáticas · 11:30–13:30"],
  ["2026-11-20","Educació Física 1r BTX B","Examen de Educación Física"]
 ];
 for(const [date,subjectName,title] of examSpecs){const sub=data.subjects.find(s=>s.name===subjectName);if(sub&&!data.tasks.some(t=>t.type==="exam"&&t.date===date&&t.subjectId===sub.id))data.tasks.push({id:crypto.randomUUID(),title,subjectId:sub.id,date,type:"exam",done:false})}
 localStorage.setItem(examSeedKey,"1");
}
localStorage.setItem(KEY,JSON.stringify(data));
let page='dashboard',editId=null,month=new Date(today.getFullYear(),today.getMonth(),1),taskFilter='all';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function subject(id){return data.subjects.find(s=>s.id===id)}function fmt(date,opts={day:'numeric',month:'short'}){if(!date)return tr('No due date');return new Date(date+'T12:00:00').toLocaleDateString(language==='es'?'es-ES':language==='ca'?'ca-ES':'en-GB',opts)}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1900)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function updateHeader(){const day=new Intl.DateTimeFormat(language==='es'?'es-ES':language==='ca'?'ca-ES':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today);$('#eyebrow').textContent=day.toUpperCase();const heads={dashboard:['Good to see you 👋','Here’s what’s happening with your studies.'],tasks:['Assignments','Keep track of everything you need to get done.'],subjects:['Your subjects','See how you’re progressing in each subject.'],calendar:['Calendar','Your exams and deadlines, all in one place.']};$('#pagetitle').textContent=tr(heads[page][0]);$('#pagesub').textContent=tr(heads[page][1]);$('#addBtn').classList.toggle('hidden',page==='subjects');$('#addBtn').textContent=page==='calendar'?'＋ Add event':'＋ Add task'}
function taskHtml(t){let s=subject(t.subjectId);return `<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Complete task" data-check="${t.id}" ${t.done?'checked':''}><div class="taskinfo"><div class="taskname">${esc(t.title)}</div><div class="taskmeta">${s?esc(s.name):'No subject'} · ${fmt(t.date)}</div></div><span class="pill">${t.type==='exam'?'Exam':t.type==='delivery'?'Delivery':'Homework'}</span><div class="taskactions"><button class="smallbtn" data-edit="${t.id}" title="Edit">✎</button><button class="smallbtn" data-delete="${t.id}" title="Delete">×</button></div></div>`}
function stats(){let open=data.tasks.filter(t=>!t.done),done=data.tasks.filter(t=>t.done),upcoming=open.filter(t=>t.date&&t.date>=iso(today));return {open,done,upcoming,exams:open.filter(t=>t.type==='exam')}}
function dashboard(){let st=stats(),soon=st.open.filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return `<div class="stats"><div class="stat"><div class="stathead">Pending tasks <span>◷</span></div><div class="statnum">${st.open.length}</div><div class="statnote">Tasks left to complete</div></div><div class="stat"><div class="stathead">Completed <span>✓</span></div><div class="statnum">${st.done.length}</div><div class="statnote">You’ve got this</div></div><div class="stat"><div class="stathead">Upcoming <span>⌁</span></div><div class="statnum">${st.upcoming.length}</div><div class="statnote">With a future due date</div></div><div class="stat"><div class="stathead">Exams <span>▦</span></div><div class="statnum">${st.exams.length}</div><div class="statnote">Still to prepare for</div></div></div><div class="contentgrid"><div class="card"><div class="cardtitle">Upcoming assignments <button class="smallbtn" data-goto="tasks">View all →</button></div><div class="tasklist">${soon.length?soon.map(taskHtml).join(''):'<div class="empty">No upcoming tasks yet.<br>Add your first assignment to get started.</div>'}</div></div><div class="card"><div class="cardtitle">Subject progress <button class="smallbtn" data-goto="subjects">View all →</button></div><div class="subjectlist">${subjectProgress()}</div></div></div>`}
function subjectProgress(){return data.subjects.length?data.subjects.map(s=>{let all=data.tasks.filter(t=>t.subjectId===s.id),done=all.filter(t=>t.done).length,p=all.length?Math.round(done/all.length*100):0;return `<div><div class="subjectrow"><span class="dot" style="background:${s.color}"></span><span class="subjectname">${esc(s.name)}</span><span class="subjectcount">${done}/${all.length}</span></div><div class="progress"><span style="width:${p}%;background:${s.color}"></span></div></div>`}).join(''):'<div class="empty">Add your first subject.</div>'}
function tasksPage(){return `<div class="card"><div class="sectionbar"><div class="cardtitle" style="margin:0">All assignments <span class="muted" style="font-size:11px;font-weight:500">${data.tasks.length} total</span></div><div class="filters"><select class="field" id="filterSubject"><option value="all">All subjects</option>${data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><select class="field" id="filterStatus"><option value="all">All tasks</option><option value="open">Pending</option><option value="done">Completed</option></select></div></div><div class="tasktable" id="filteredTasks"></div></div>`}
function subjectsPage(){return `<div class="sectionbar"><div class="muted">${data.subjects.length} subjects</div><button class="btn primary" id="addSubject">＋ Add subject</button></div><div class="subjectgrid">${data.subjects.map(s=>{let all=data.tasks.filter(t=>t.subjectId===s.id),done=all.filter(t=>t.done).length,p=all.length?Math.round(done/all.length*100):0;return `<div class="subjectcard"><div class="subjecttop"><span class="dot" style="background:${s.color};width:12px;height:12px"></span><span style="flex:1">${esc(s.name)}</span><button class="smallbtn" data-subject-delete="${s.id}" title="Delete subject">×</button></div><div class="progress"><span style="width:${p}%;background:${s.color}"></span></div><div class="subjectcount">${done} of ${all.length} tasks completed · ${p}%</div></div>`}).join('')}</div>`}
function calendarPage(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+days)/7)*7;let html='';for(let i=0;i<cells;i++){let n=i-offset+1;if(i<7){}let date=n>0&&n<=days?iso(new Date(y,m,n)):null;let events=date?data.tasks.filter(t=>t.date===date):[];html+=`<div class="day ${date===iso(today)?'today':''}">${date?`<div class="daynum">${n}</div>${events.map(t=>`<div class="event ${t.type}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}`:''}</div>`}return `<div class="card"><div class="calendarhead"><div class="monthlabel">${month.toLocaleDateString(language==='es'?'es-ES':language==='ca'?'ca-ES':'en-GB',{month:'long',year:'numeric'})}</div><div><button class="btn iconbtn" id="prevMonth">‹</button> <button class="btn iconbtn" id="nextMonth">›</button></div></div><div class="calendar">${(language==='es'?['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']:language==='ca'?['Dl','Dt','Dc','Dj','Dv','Ds','Dg']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(d=>`<div class="dayname">${d}</div>`).join('')}${html}</div><div style="display:flex;gap:15px;margin-top:14px;color:var(--muted);font-size:11px"><span>🟣 Homework</span><span>🟠 Exam</span><span>🟢 Delivery</span></div></div>`}
function render(){updateHeader();$('#view').innerHTML=translateMarkup(({dashboard,tasks:tasksPage,subjects:subjectsPage,calendar:calendarPage}[page])());if(page==='tasks')applyFilters();applyStaticTranslations();}
function applyStaticTranslations(){document.querySelectorAll('#nav button').forEach(b=>{let key=b.dataset.page==='dashboard'?'Overview':b.dataset.page==='tasks'?'Assignments':b.dataset.page==='subjects'?'Subjects':'Calendar';b.querySelector('.ico').nextSibling.textContent=' '+tr(key)});$('.navlabel').textContent=tr('WORKSPACE');$('.sidebottom').innerHTML=tr('Your academic life,')+'<br>'+tr('under control.')+'<br><br><span id="localnote">'+tr('Saved on this device')+'</span>';$('#languageSelect').value=language;$('#themeSelect').value=document.documentElement.dataset.theme||'light';$('#modalTitle').textContent=tr($('#modalTitle').textContent);document.querySelectorAll('.formrow label').forEach(el=>el.textContent=tr(el.textContent));$('#cancelBtn').textContent=tr('Cancel');$('#taskform button[type=submit]').textContent=tr('Save task');$('#tasktype').options[0].text=tr('Homework');$('#tasktype').options[1].text=tr('Exam');$('#tasktype').options[2].text=tr('Delivery');$('#themeSelect').options[0].textContent=language==='es'?'☀ Claro':language==='ca'?'☀ Clar':'☀ Light';$('#themeSelect').options[1].textContent=language==='es'?'☾ Oscuro':language==='ca'?'☾ Fosc':'☾ Dark';$('#languageSelect').setAttribute('aria-label',language==='es'?'Idioma':language==='ca'?'Idioma':'Language');$('#themeSelect').setAttribute('aria-label',language==='es'?'Tema':language==='ca'?'Tema':'Theme');$('#addBtn').textContent=tr(page==='calendar'?'＋ Add event':'＋ Add task');}
function applyFilters(){let sub=$('#filterSubject')?.value||'all',status=$('#filterStatus')?.value||'all';let arr=data.tasks.filter(t=>(sub==='all'||t.subjectId===sub)&&(status==='all'||(status==='done'?t.done:!t.done))).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));$('#filteredTasks').innerHTML=translateMarkup(arr.length?arr.map(taskHtml).join(''):'<div class="empty">No tasks match these filters.</div>')}
function openModal(id=null){editId=id;let t=id?data.tasks.find(x=>x.id===id):null;$('#modalTitle').textContent=tr(t?'Edit assignment':'Add assignment');$('#tasktitle').value=t?.title||'';$('#taskdate').value=t?.date||'';$('#tasktype').value=t?.type||'homework';$('#tasksubject').innerHTML=data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(t)$('#tasksubject').value=t.subjectId;$('#modalback').classList.add('show');$('#tasktitle').focus()}
function closeModal(){$('#modalback').classList.remove('show')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#addBtn').onclick=()=>{if(!data.subjects.length){toast('Add a subject first');setPage('subjects');return}openModal()};$('#cancelBtn').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});$('#taskform').onsubmit=e=>{e.preventDefault();let item={id:editId||crypto.randomUUID(),title:$('#tasktitle').value.trim(),subjectId:$('#tasksubject').value,date:$('#taskdate').value,type:$('#tasktype').value,done:editId?data.tasks.find(t=>t.id===editId).done:false};if(editId)data.tasks=data.tasks.map(t=>t.id===editId?item:t);else data.tasks.push(item);save();closeModal();render();toast(editId?'Task updated':'Task added')};
$('#view').addEventListener('click',e=>{let el=e.target.closest('[data-edit],[data-delete],[data-goto],[data-subject-delete],#addSubject,#prevMonth,#nextMonth');if(!el)return;if(el.dataset.edit)openModal(el.dataset.edit);if(el.dataset.delete){data.tasks=data.tasks.filter(t=>t.id!==el.dataset.delete);save();render();toast('Task deleted')}if(el.dataset.goto)setPage(el.dataset.goto);if(el.id==='addSubject'){let name=prompt('Subject name:');if(name?.trim()){data.subjects.push({id:crypto.randomUUID(),name:name.trim(),color:palette[data.subjects.length%palette.length]});save();render();toast('Subject added')}}if(el.dataset.subjectDelete){let id=el.dataset.subjectDelete;if(data.tasks.some(t=>t.subjectId===id)){if(!confirm('This subject has tasks. Delete the subject and its tasks?'))return;data.tasks=data.tasks.filter(t=>t.subjectId!==id)}data.subjects=data.subjects.filter(s=>s.id!==id);save();render();toast('Subject deleted')}if(el.id==='prevMonth'){month=new Date(month.getFullYear(),month.getMonth()-1,1);render()}if(el.id==='nextMonth'){month=new Date(month.getFullYear(),month.getMonth()+1,1);render()}});
$('#view').addEventListener('change',e=>{if(e.target.matches('[data-check]')){let t=data.tasks.find(x=>x.id===e.target.dataset.check);if(t)t.done=e.target.checked;save();render()}if(e.target.id==='filterSubject'||e.target.id==='filterStatus')applyFilters()});$('#languageSelect').addEventListener('change',e=>{language=e.target.value;localStorage.setItem(LANG,language);render();});$('#themeSelect').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;localStorage.setItem(THEME,e.target.value);});let savedTheme=localStorage.getItem(THEME)||'light';document.documentElement.dataset.theme=savedTheme;render();
</script></body></html>

function render(){updateHeader();const renderer=({dashboard,tasks:tasksPage,subjects:subjectsPage,calendar:calendarPage,settings:settingsPage}[page])||dashboard;const markup=renderer();$('#view').innerHTML=page==='tasks'?markup:translateMarkup(markup);if(page==='tasks')applyFilters();applyStaticTranslations();}
function applyStaticTranslations(){document.querySelectorAll('#nav button').forEach(b=>{let key=b.dataset.page==='dashboard'?'Overview':b.dataset.page==='tasks'?'Assignments':b.dataset.page==='subjects'?'Subjects':'Calendar';b.querySelector('.ico').nextSibling.textContent=' '+tr(key);b.classList.toggle('active',b.dataset.page===page)});$('.navlabel').textContent=tr('WORKSPACE');$('.sidebottom').innerHTML=tr('Your academic life,')+'<br>'+tr('under control.')+'<br><br><span id="localnote">'+tr('Saved on this device')+'</span>';$('#settingsNavText').textContent=tr('Settings');$('#settingsBtn').title=tr('Settings');$('#settingsBtn').classList.toggle('active',page==='settings');$('#modalTitle').textContent=tr($('#modalTitle').textContent);document.querySelectorAll('.formrow label').forEach(el=>el.textContent=tr(el.textContent));$('#cancelBtn').textContent=tr('Cancel');$('#taskform button[type=submit]').textContent=tr('Save task');$('#tasktype').options[0].text=tr('Homework');$('#tasktype').options[1].text=tr('Exam');$('#tasktype').options[2].text=tr('Delivery');$('#addBtn').textContent=tr(page==='calendar'?'＋ Add event':'＋ Add task');}
function applyFilters(){const container=$('#filteredTasks');if(!container)return;const sub=$('#filterSubject')?.value||'all',status=$('#filterStatus')?.value||'all';const allAssignments=Array.isArray(data.tasks)?data.tasks.filter(t=>t&&t.type!=='exam'):[];const arr=allAssignments.filter(t=>(sub==='all'||t.subjectId===sub)&&(status==='all'||(status==='done'?!!t.done:!t.done))).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));container.innerHTML=arr.length?arr.map(taskHtml).join(''):`<div class="empty">${tr('No tasks match these filters.')}</div>`;}
function openModal(id=null){editId=id;let t=id?data.tasks.find(x=>x.id===id):null;$('#modalTitle').textContent=tr(t?'Edit assignment':'Add assignment');$('#tasktitle').value=t?.title||'';$('#taskdate').value=t?.date||'';$('#tasktype').value=t?.type||'homework';$('#tasksubject').innerHTML=data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(t)$('#tasksubject').value=t.subjectId;$('#modalback').classList.add('show');$('#tasktitle').focus()}
function closeModal(){$('#modalback').classList.remove('show')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#settingsBtn').onclick=()=>setPage('settings');$('#addBtn').onclick=()=>{if(!data.subjects.length){toast('Add a subject first');setPage('subjects');return}openModal()};$('#cancelBtn').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});$('#taskform').onsubmit=e=>{e.preventDefault();let item={id:editId||crypto.randomUUID(),title:$('#tasktitle').value.trim(),subjectId:$('#tasksubject').value,date:$('#taskdate').value,type:$('#tasktype').value,done:editId?data.tasks.find(t=>t.id===editId).done:false};if(editId)data.tasks=data.tasks.map(t=>t.id===editId?item:t);else data.tasks.push(item);save();closeModal();render();toast(editId?'Task updated':'Task added')};
function exportBackup(){const payload={app:'StudyFlow',version:1,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='studyflow-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast(tr('Backup downloaded'))}
async function importBackup(file){try{const parsed=JSON.parse(await file.text()),incoming=parsed.data||parsed;if(!incoming||!Array.isArray(incoming.subjects)||!Array.isArray(incoming.tasks))throw new Error('Invalid format');if(!confirm(tr('Importing a backup replaces your current subjects and tasks. Continue?')))return;data={subjects:incoming.subjects,tasks:incoming.tasks};save();render();toast(tr('Backup imported'))}catch(error){alert(tr('Invalid backup file'))}}
$('#view').addEventListener('click',e=>{const priorityToggle=e.target.closest('[data-priority-toggle]');if(priorityToggle){const id=priorityToggle.dataset.priorityToggle;const panel=[...document.querySelectorAll('[data-priority-picker]')].find(node=>node.dataset.priorityPicker===id);if(panel){panel.hidden=!panel.hidden;priorityToggle.setAttribute('aria-expanded',String(!panel.hidden))}return}const priorityChoice=e.target.closest('[data-priority-choice]');if(priorityChoice){const targetSubject=data.subjects.find(item=>item.id===priorityChoice.dataset.subjectId);if(targetSubject){if(priorityChoice.dataset.priorityChoice==='auto')delete targetSubject.manualPriority;else{const chosen=Number(priorityChoice.dataset.priorityChoice);if(Number.isInteger(chosen)&&chosen>=1&&chosen<=5)targetSubject.manualPriority=chosen}save();render();toast(tr('Priority updated'))}return}const taskLink=e.target.closest('[data-open-task]');if(taskLink){const target=data.tasks.find(t=>t.id===taskLink.dataset.openTask);if(target){setPage('tasks');const filter=$('#filterSubject');if(filter){filter.value=target.subjectId||'all';applyFilters()}const row=[...document.querySelectorAll('[data-task-row]')].find(node=>node.dataset.taskRow===target.id);if(row){row.classList.add('task-focus');row.scrollIntoView({behavior:'smooth',block:'center'})}}return}let el=e.target.closest('[data-edit],[data-delete],[data-goto],[data-subject-delete],#addSubject,#prevMonth,#nextMonth,#exportBackup,#importBackup');if(!el)return;if(el.id==='exportBackup')exportBackup();if(el.id==='importBackup')$('#backupFile').click();if(el.dataset.edit)openModal(el.dataset.edit);if(el.dataset.delete){data.tasks=data.tasks.filter(t=>t.id!==el.dataset.delete);save();render();toast('Task deleted')}if(el.dataset.goto)setPage(el.dataset.goto);if(el.id==='addSubject'){let name=prompt('Subject name:');if(name?.trim()){data.subjects.push({id:crypto.randomUUID(),name:name.trim(),color:palette[data.subjects.length%palette.length]});save();render();toast('Subject added')}}if(el.dataset.subjectDelete){let id=el.dataset.subjectDelete;if(data.tasks.some(t=>t.subjectId===id)){if(!confirm('This subject has tasks. Delete the subject and its tasks?'))return;data.tasks=data.tasks.filter(t=>t.subjectId!==id)}data.subjects=data.subjects.filter(s=>s.id!==id);save();render();toast('Subject deleted')}if(el.id==='prevMonth'){month=new Date(month.getFullYear(),month.getMonth()-1,1);render()}if(el.id==='nextMonth'){month=new Date(month.getFullYear(),month.getMonth()+1,1);render()}});
$('#view').addEventListener('change',e=>{if(e.target.matches('[data-check]')){let t=data.tasks.find(x=>x.id===e.target.dataset.check);if(t)t.done=e.target.checked;save();render()}if(e.target.id==='filterSubject'||e.target.id==='filterStatus')applyFilters();if(e.target.id==='settingLanguage'){language=e.target.value;localStorage.setItem(LANG,language);document.documentElement.lang=language;render();toast(tr('Language updated'))}if(e.target.id==='settingTheme'){applyTheme(e.target.value);render();toast(tr('Theme updated'))}if(e.target.id==='settingWeek'){localStorage.setItem(WEEK_START,e.target.value);render();toast(tr('Preferences saved'))}if(e.target.id==='settingHome'){localStorage.setItem(HOME_PAGE,e.target.value);toast(tr('Preferences saved'))}if(e.target.id==='backupFile'&&e.target.files?.[0])importBackup(e.target.files[0])});let savedTheme=localStorage.getItem(THEME)||'light';applyTheme(savedTheme,false);document.documentElement.lang=language;render();
</script></body></html>
